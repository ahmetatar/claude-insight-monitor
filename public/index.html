<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Claude Insight Monitor — Claude Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- The theme runs before the first paint, so a dark session never flashes
     white on reload. The stored pick wins; the OS is only the first guess. -->
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('context-dump:theme'); } catch (e) {}
    var dark = stored === 'dark' || (stored !== 'light'
      && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ground:  { DEFAULT: '#F4F4F7', dk: '#08090C' },
          panel:   { DEFAULT: '#FFFFFF', dk: '#101216' },
          sunken:  { DEFAULT: '#EEEEF2', dk: '#0C0D11' },
          edge:    { DEFAULT: '#E2E2EA', dk: '#20232B' },
          ink:     { DEFAULT: '#14151A', dk: '#EFEEF4' },
          dim:     { DEFAULT: '#6A6E7E', dk: '#848A9C' },
          accent:  { DEFAULT: '#C4562F', dk: '#E8825C' },
          signal:  { DEFAULT: '#2F7F76', dk: '#4FC0AE' },
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'system-ui', 'sans-serif'],
          mono: ['ui-monospace', '"SF Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
        },
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-ground dark:bg-ground-dk text-ink dark:text-ink-dk font-sans text-[13.5px] antialiased">

  <!-- ══════════════════════════════════════════════════════ icon sprite -->
  <!-- One stroke-drawn set, referenced by <use> everywhere. Icons carry the
       card's subject so a dashboard of eleven panels can be scanned by shape
       instead of read title by title. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <g id="ico-base"></g>
    </defs>
    <symbol id="i-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.34 19a10 10 0 1 1 17.32 0" /><path d="m12 14 4-4" />
    </symbol>
    <symbol id="i-trend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" />
    </symbol>
    <symbol id="i-wire" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
    </symbol>
    <symbol id="i-route" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="19" r="2.5" /><circle cx="18" cy="5" r="2.5" />
      <path d="M8.5 19h9a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7h9" />
    </symbol>
    <symbol id="i-threads" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" />
    </symbol>
    <symbol id="i-cache" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14a9 3 0 0 0 18 0V5" /><path d="M3 12a9 3 0 0 0 18 0" />
    </symbol>
    <symbol id="i-think" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3-1.9 5.8L4.3 10.7l5.8 1.9L12 18.4l1.9-5.8 5.8-1.9-5.8-1.9Z" /><path d="M19 3v4" /><path d="M17 5h4" />
    </symbol>
    <symbol id="i-pie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.2 15.9A10 10 0 1 1 8 2.8" /><path d="M22 12A10 10 0 0 0 12 2v10z" />
    </symbol>
    <symbol id="i-time" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /><path d="M12 7.5V12l3 2" />
    </symbol>
    <symbol id="i-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z" />
    </symbol>
    <symbol id="i-prompt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" />
      <line x1="15" y1="13" x2="8" y2="13" /><line x1="15" y1="17" x2="8" y2="17" />
    </symbol>
    <symbol id="i-braces" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1" />
      <path d="M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1" />
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9" />
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6" />
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" />
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16" y2="16" />
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6 3 20 12 6 21 6 3" />
    </symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0l-4.6-4.6a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4z" />
      <path d="m7.5 10.5 2 2" /><path d="m10.5 7.5 2 2" /><path d="m13.5 4.5 2 2" />
    </symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5" /><line x1="12" y1="19" x2="20" y2="19" />
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="9" y1="6" x2="20" y2="6" /><line x1="9" y1="12" x2="20" y2="12" /><line x1="9" y1="18" x2="20" y2="18" />
      <circle cx="4.5" cy="6" r="1" /><circle cx="4.5" cy="12" r="1" /><circle cx="4.5" cy="18" r="1" />
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="17" x2="12" y2="22" /><path d="M9 2h6l-1 7 3 3v2H7v-2l3-3z" />
    </symbol>
    <symbol id="i-session" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2.5" /><line x1="3" y1="9" x2="21" y2="9" />
    </symbol>
    <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" /><line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" />
    </symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 14 10 14 10 20" /><polyline points="20 10 14 10 14 4" /><line x1="14" y1="10" x2="21" y2="3" /><line x1="3" y1="21" x2="10" y2="14" />
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </symbol>
  </svg>

  <div class="aurora" aria-hidden="true"></div>

  <!-- ─────────────────────────────────────── theme, top right, always -->
  <div class="theme-dock">
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <button id="theme-light" type="button" class="theme-opt" aria-pressed="false" title="Light mode">
        <svg class="ico ico-xs"><use href="#i-sun" /></svg><span>Light</span>
      </button>
      <button id="theme-dark" type="button" class="theme-opt" aria-pressed="false" title="Dark mode">
        <svg class="ico ico-xs"><use href="#i-moon" /></svg><span>Dark</span>
      </button>
    </div>
  </div>

  <div class="relative grid grid-cols-1 lg:grid-cols-[268px_1fr] min-h-screen">

    <!-- ───────────────────────────────────────────────── sessions rail -->
    <aside class="rail relative z-30 lg:h-screen lg:sticky lg:top-0 flex flex-col border-b lg:border-b-0 lg:border-r border-edge dark:border-edge-dk">
      <div class="px-6 pt-7 pb-6">
        <div class="flex items-center gap-2.5">
          <span class="mark"></span>
          <h1 class="text-[15px] font-semibold tracking-tight leading-none">Claude&nbsp;Insight&nbsp;Monitor</h1>
        </div>
        <p class="mt-2.5 text-[11.5px] leading-relaxed text-dim dark:text-dim-dk max-w-[26ch]">
          Every byte Claude Code sends, in the open.
        </p>
      </div>

      <div class="px-6 pb-6 flex items-center gap-2">
        <span class="pill">
          <span id="live-dot" class="w-1.5 h-1.5 rounded-full bg-dim dark:bg-dim-dk shrink-0"></span>
          <span id="live-label">connecting</span>
        </span>
        <span class="pill">
          <b id="turn-count" class="text-ink dark:text-ink-dk font-semibold tabular-nums">0</b>&nbsp;turns
        </span>
      </div>

      <div class="px-6 pb-2 label-eyebrow flex items-center gap-2">
        <svg class="ico ico-xs"><use href="#i-session" /></svg> Sessions
      </div>
      <ul id="session-list" class="px-3.5 pb-6 flex flex-col gap-0.5 overflow-y-auto grow max-h-[34vh] lg:max-h-none"></ul>
    </aside>

    <!-- ──────────────────────────────────────────────────────── detail -->
    <main id="detail" class="relative z-10 min-w-0"></main>
  </div>

  <!-- ─────────────────────────────────────────────── section inspector -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Section detail">
    <header class="shrink-0 px-7 pt-6 pb-5 border-b border-edge dark:border-edge-dk">
      <div class="flex items-start gap-4">
        <div class="min-w-0 grow">
          <div id="drawer-kind" class="label-eyebrow"></div>
          <h2 id="drawer-title" class="mt-2 font-mono text-[16px] font-semibold tracking-tight break-all leading-snug"></h2>
        </div>
        <button id="drawer-close" type="button" class="nav-btn shrink-0" title="Close (Esc)" aria-label="Close">
          <svg class="ico"><use href="#i-x" /></svg>
        </button>
      </div>
      <dl id="drawer-stats" class="mt-5 grid grid-cols-3 gap-4"></dl>
    </header>
    <div id="drawer-body" class="grow overflow-y-auto px-7 py-6 flex flex-col gap-7"></div>
  </aside>

  <!-- ═════════════════════════════════════════════════════ templates -->

  <template id="tpl-empty">
    <div class="px-8 sm:px-14 py-24 max-w-[62ch]">
      <div class="label-eyebrow mb-5 flex items-center gap-2">
        <svg class="ico ico-xs"><use href="#i-terminal" /></svg> Waiting for traffic
      </div>
      <h2 class="text-[clamp(28px,4vw,44px)] font-semibold tracking-[-0.03em] leading-[1.08]">
        Nothing captured<br /><span class="text-dim dark:text-dim-dk">yet.</span>
      </h2>
      <p class="mt-7 text-[14px] leading-[1.75] text-dim dark:text-dim-dk">
        Point <code class="kbd">ANTHROPIC_BASE_URL</code> at this proxy and run
        <code class="kbd">claude</code>. Every request lands here — system prompt,
        messages, tool definitions, and real token usage.
      </p>
      <div class="mt-9 rounded-xl border border-edge dark:border-edge-dk bg-panel dark:bg-panel-dk overflow-hidden">
        <div class="px-4 py-2.5 border-b border-edge dark:border-edge-dk label-eyebrow flex items-center gap-2">
          <svg class="ico ico-xs"><use href="#i-terminal" /></svg> shell
        </div>
        <pre class="px-4 py-3.5 font-mono text-[12px] leading-[1.9] overflow-x-auto"><span class="text-dim dark:text-dim-dk">$</span> export ANTHROPIC_BASE_URL=<span class="text-signal dark:text-signal-dk">http://127.0.0.1:8787</span>
<span class="text-dim dark:text-dim-dk">$</span> claude</pre>
      </div>
    </div>
  </template>

  <template id="tpl-detail">
    <div class="min-w-0">

      <!-- turn ribbon ------------------------------------------------- -->
      <div class="ribbon-wrap sticky top-0 z-20 px-6 sm:px-10 pt-6 pb-4 border-b border-edge dark:border-edge-dk">
       <div class="mx-auto w-full max-w-[1680px]">
        <div class="flex items-end justify-between gap-6 mb-3 pr-[136px]">
          <div class="min-w-0">
            <div class="label-eyebrow">Turns</div>
            <div class="mt-1.5 flex items-baseline gap-2.5 min-w-0">
              <span id="ribbon-title" class="text-[15px] font-semibold tracking-tight tabular-nums"></span>
              <span id="ribbon-meta" class="font-mono text-[11px] text-dim dark:text-dim-dk truncate"></span>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button id="cards-toggle-all" type="button" class="ghost-btn with-ico" title="Collapse every card">
              <svg class="ico ico-xs"><use href="#i-collapse" /></svg><span>Collapse all</span>
            </button>
            <button id="turn-follow" type="button" hidden
              class="nav-btn pin-btn with-ico"
              title="Pinned to this turn — click to follow the newest again">
              <svg class="ico ico-xs"><use href="#i-pin" /></svg><span>pinned ×</span>
            </button>
            <button id="turn-prev" type="button" class="nav-btn" title="Previous turn" aria-label="Previous turn">
              <svg class="ico"><use href="#i-arrow-left" /></svg>
            </button>
            <button id="turn-next" type="button" class="nav-btn" title="Next turn" aria-label="Next turn">
              <svg class="ico"><use href="#i-arrow-right" /></svg>
            </button>
          </div>
        </div>
        <div id="ribbon" class="ribbon"></div>
       </div>
      </div>

      <div class="mx-auto w-full max-w-[1680px] px-6 sm:px-10 py-10 pb-20">
       <div class="dash">

        <!-- hero: gauge + numbers ------------------------------------- -->
        <section class="card col-12" id="context-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-gauge" /></svg></span>
              <h3>Context window</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="context-sub"></span>
            </div>
          </div>
          <div class="card-body">
            <div class="hero">
              <div class="gauge-slot">
                <svg id="gauge" viewBox="0 0 160 160" class="w-[188px] h-[188px] -rotate-90"></svg>
                <div class="gauge-center">
                  <div id="gauge-pct" class="text-[34px] font-semibold tracking-[-0.04em] tabular-nums leading-none"></div>
                  <div id="gauge-cap" class="mt-1.5 font-mono text-[10px] uppercase tracking-[0.12em] text-dim dark:text-dim-dk"></div>
                </div>
              </div>

              <div class="min-w-0">
                <div class="label-eyebrow mb-6">Token usage this turn</div>
                <dl id="usage-stats" class="cells"></dl>
              </div>
            </div>
          </div>
        </section>

        <!-- history --------------------------------------------------- -->
        <section class="card col-7" id="history-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-trend" /></svg></span>
              <h3>History over time</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="history-sub"></span>
            </div>
          </div>
          <div class="card-body">
            <div class="h-[248px] min-w-0 relative"><canvas id="history-canvas"></canvas></div>
          </div>
          <div class="card-foot" id="history-foot"></div>
        </section>

        <!-- network --------------------------------------------------- -->
        <section class="card col-5" id="network-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-wire" /></svg></span>
              <h3>Over the wire</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="network-sub"></span>
            </div>
          </div>
          <div class="card-body flex flex-col gap-8">
            <dl id="network-stats" class="cells divide-cells"></dl>
            <div class="min-w-0" id="network-limits-wrap">
              <div class="label-eyebrow mb-4">Rate limit budget</div>
              <div id="network-limits" class="flex flex-col"></div>
            </div>
          </div>
          <div class="card-foot" id="network-foot"></div>
        </section>

        <!-- calls ----------------------------------------------------- -->
        <section class="card col-6" id="calls-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-route" /></svg></span>
              <h3>Where the calls go</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="calls-sub"></span>
            </div>
          </div>
          <div class="card-body">
            <div id="calls-rows" class="flex flex-col"></div>
          </div>
          <div class="card-foot" id="calls-foot"></div>
        </section>

        <!-- threads --------------------------------------------------- -->
        <section class="card col-6" id="threads-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-threads" /></svg></span>
              <h3>Threads</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="threads-sub"></span>
            </div>
          </div>
          <div class="card-body">
            <div id="threads-rows" class="flex flex-col"></div>
          </div>
          <div class="card-foot" id="threads-foot"></div>
        </section>

        <!-- cache ----------------------------------------------------- -->
        <section class="card col-7" id="cache-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-cache" /></svg></span>
              <h3>Cache</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="cache-sub"></span>
            </div>
          </div>
          <div class="card-body flex flex-col gap-8">
            <div id="cache-verdict" class="flex flex-col gap-3"></div>
            <div class="min-w-0">
              <div class="label-eyebrow mb-4">Prefix, in cache order</div>
              <div id="cache-strip" class="cache-strip"></div>
              <div id="cache-strip-legend" class="mt-3 flex flex-wrap gap-x-6 gap-y-2"></div>
            </div>
            <dl id="cache-cost" class="cells divide-cells"></dl>
          </div>
          <div class="card-foot" id="cache-session"></div>
        </section>

        <!-- thinking -------------------------------------------------- -->
        <section class="card col-5" id="thinking-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-think" /></svg></span>
              <h3>Thinking</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="thinking-sub"></span>
            </div>
          </div>
          <div class="card-body flex flex-col gap-7">
            <div id="thinking-shape" class="flex flex-wrap items-center gap-2"></div>
            <div class="min-w-0">
              <div class="meter"><span id="thinking-meter"></span></div>
              <div id="thinking-note" class="mt-4 text-[13px] leading-relaxed text-dim dark:text-dim-dk max-w-[74ch]"></div>
            </div>
          </div>
          <div class="card-foot" id="thinking-foot"></div>
        </section>

        <!-- composition ----------------------------------------------- -->
        <section class="card col-12" id="composition-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-pie" /></svg></span>
              <h3>What fills the window</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="breakdown-sub"></span>
              <button id="measure-btn" type="button" class="ghost-btn with-ico shrink-0"
                title="Counts this turn's sections exactly, using four count_tokens calls">
                <svg class="ico ico-xs"><use href="#i-ruler" /></svg><span>Measure exactly</span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <div id="composition-bar" class="comp-bar"></div>
            <div id="composition-legend" class="cells-3 mt-8 divide-cells"></div>
            <div id="measure-result" class="mt-8" hidden></div>
          </div>
          <div class="card-foot" id="breakdown-detail"></div>
        </section>

        <!-- tools ----------------------------------------------------- -->
        <section class="card col-6" id="tools-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-tools" /></svg></span>
              <h3>Tool definitions</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="tools-sub"></span>
            </div>
          </div>
          <div class="card-body flex flex-col min-h-0">
            <div id="tools-rows" class="flex flex-col grow min-h-0 max-h-[60vh] overflow-y-auto"></div>
          </div>
          <div class="card-foot" id="tools-foot"></div>
        </section>

        <!-- system prompt --------------------------------------------- -->
        <section class="card col-6" id="prompt-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-prompt" /></svg></span>
              <h3>Inside the system prompt</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="prompt-sub"></span>
            </div>
          </div>
          <div class="card-body flex flex-col gap-8">
            <div id="prompt-sections" class="flex flex-col"></div>
            <div class="min-w-0" id="prompt-reminders-wrap">
              <div class="label-eyebrow mb-4">Injected into the messages</div>
              <div id="prompt-reminders" class="flex flex-col"></div>
            </div>
          </div>
          <div class="card-foot" id="prompt-foot"></div>
        </section>

        <!-- time machine ---------------------------------------------- -->
        <section class="card col-12" id="machine-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-time" /></svg></span>
              <h3>Time machine</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <span class="font-mono text-[11px] text-dim dark:text-dim-dk" id="machine-sub"></span>
            </div>
          </div>
          <div class="card-body machine-grid">

            <div class="min-w-0">
              <div class="label-eyebrow mb-4">Compare this turn against</div>
              <div class="flex flex-wrap items-center gap-3">
                <select id="diff-target" class="field font-mono text-[11.5px]"></select>
                <span id="diff-status" class="font-mono text-[10.5px] text-dim dark:text-dim-dk"></span>
              </div>
              <div id="diff-result" class="mt-6 flex flex-col" hidden></div>
            </div>

            <div class="min-w-0">
              <div class="label-eyebrow mb-4">Send it again, changed</div>
              <div class="flex flex-wrap items-end gap-4">
                <label class="flex flex-col gap-2">
                  <span class="font-mono text-[10px] uppercase tracking-[0.12em] text-dim dark:text-dim-dk">model</span>
                  <select id="replay-model" class="field font-mono text-[11.5px]"></select>
                </label>
                <label class="flex flex-col gap-2">
                  <span class="font-mono text-[10px] uppercase tracking-[0.12em] text-dim dark:text-dim-dk">tools</span>
                  <select id="replay-tools" class="field font-mono text-[11.5px]">
                    <option value="all">as captured</option>
                    <option value="used">only the ones ever called</option>
                    <option value="none">none at all</option>
                  </select>
                </label>
                <label class="flex flex-col gap-2">
                  <span class="font-mono text-[10px] uppercase tracking-[0.12em] text-dim dark:text-dim-dk">system prompt</span>
                  <select id="replay-system" class="field font-mono text-[11.5px]">
                    <option value="keep">as captured</option>
                    <option value="drop">dropped</option>
                  </select>
                </label>
                <button id="replay-btn" type="button" class="ghost-btn with-ico"
                  title="Sends this turn to the API again with the changes above">
                  <svg class="ico ico-xs"><use href="#i-play" /></svg><span>Replay</span>
                </button>
              </div>
              <div id="replay-note" class="mt-4 font-mono text-[10.5px] text-dim dark:text-dim-dk"></div>
              <div id="replay-result" class="mt-7" hidden></div>
            </div>

          </div>
        </section>

        <!-- raw json -------------------------------------------------- -->
        <section class="card col-12" id="json-card">
          <div class="card-head">
            <button type="button" class="card-toggle" aria-expanded="true">
              <span class="ico-box"><svg class="ico"><use href="#i-braces" /></svg></span>
              <h3>Raw JSON</h3>
              <svg class="ico chev"><use href="#i-chevron-down" /></svg>
            </button>
            <div class="card-tools">
              <button id="copy-curl" type="button" class="ghost-btn with-ico" title="The captured request as a runnable curl">
                <svg class="ico ico-xs"><use href="#i-copy" /></svg><span>Copy as curl</span>
              </button>
              <button id="copy-request" type="button" class="ghost-btn with-ico" title="Just the request body, as JSON">
                <svg class="ico ico-xs"><use href="#i-copy" /></svg><span>Copy request</span>
              </button>
              <button id="json-expand" type="button" class="ghost-btn with-ico">
                <svg class="ico ico-xs"><use href="#i-expand" /></svg><span>Expand all</span>
              </button>
              <button id="json-collapse" type="button" class="ghost-btn with-ico">
                <svg class="ico ico-xs"><use href="#i-collapse" /></svg><span>Collapse all</span>
              </button>
            </div>
          </div>
          <div id="json-view" class="json-view font-mono text-[12px] leading-[1.7] max-h-[62vh] overflow-auto px-6 py-5"></div>
        </section>

       </div>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
